# Project-wide Gradle settings.
# Low-RAM build host (3.5GB total, 2 cores): keep Gradle + Kotlin daemons + OS
# + tests within physical memory.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
